# Hostinger Docker Manager용 — 서버에서 이미지를 빌드하지 않습니다.
# 1) fetch: 시작할 때마다 GitHub 저장소 최신 main을 공유 볼륨에 내려받음
# 2) web: nginx가 내려받은 파일을 8700 포트로 서빙
# 내용을 바꾼 뒤에는 GitHub에 push하고 Docker Manager에서 프로젝트를 재배포하면 됩니다.
services:
  fetch:
    image: alpine/git:latest
    entrypoint: ["sh", "-c"]
    command:
      - rm -rf /site/repo && git clone --depth 1 --branch main https://github.com/superpjh-stack/Jaeil_Media_Displayer.git /site/repo
    volumes:
      - site:/site
    restart: "no"

  web:
    image: nginx:1.27-alpine
    container_name: jaeil-media-displayer
    depends_on:
      fetch:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - sed 's#/usr/share/nginx/html#/site/repo#' /site/repo/nginx.conf > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    volumes:
      - site:/site:ro
    ports:
      - "8700:80"
    restart: unless-stopped

volumes:
  site:
